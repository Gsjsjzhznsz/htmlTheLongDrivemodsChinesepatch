<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TLD Mod Installer</title>
  <link rel="icon" href="/static/tld.ico">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<script type="application/json" id="flask-data">
{
  "version": {{ version | tojson }},
  "translations": {{ translations | tojson }}
}
</script>

<script>
(function(){
  function loadScript(src){return new Promise(function(res,rej){var s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
  loadScript('/static/js/vue.global.prod.js').catch(function(){return loadScript('https://unpkg.com/vue@3/dist/vue.global.prod.js')}).then(function(){initVueApp()}).catch(function(){document.getElementById('app').innerHTML='<div class="vue-loading"><p>Vue.js 加载失败，请刷新重试。</p></div>'})
})();
</script>

{% raw %}

<div id="app" :class="{ 'sidebar-collapsed': sidebarCollapsed }">

  <!-- 移动端菜单按钮 -->
  <button class="mobile-menu-btn" @click="mobileMenuOpen = !mobileMenuOpen">☰</button>
  <div class="mobile-overlay" :class="{ active: mobileMenuOpen }" @click="mobileMenuOpen = false"></div>

  <div class="vue-loading" v-if="!appReady">{{ t('loading') }}</div>

  <template v-else>

  <!-- ==================== 侧边栏 ==================== -->
  <aside class="sidebar" :class="{ collapsed: sidebarCollapsed, 'mobile-open': mobileMenuOpen }">
    <div class="sidebar-header">
      <span class="logo-icon">🚗</span>
      <span class="logo-text" v-show="!sidebarCollapsed || mobileMenuOpen">{{ t('app_title') }}</span>
    </div>
    <ul class="nav-list">
      <li class="nav-item" :class="{ active: activeTab === 'browse' }" @click="switchTab('browse')">
        <svg viewBox="0 0 24 24"><path d="M4 4h4v4H4zm6 0h4v4h-4zm6 0h4v4h-4zM4 10h4v4H4zm6 0h4v4h-4zm6 0h4v4h-4zM4 16h4v4H4zm6 0h4v4h-4zm6 0h4v4h-4z"/></svg>
        <span class="menu-text">{{ t('browse_mods') }}</span>
      </li>
      <li class="nav-item" :class="{ active: activeTab === 'modpacks' }" @click="switchTab('modpacks')">
        <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-1 9h-4v4h-2v-4H9v-2h4V5h2v4h4v2z"/></svg>
        <span class="menu-text">{{ t('modpacks') }}</span>
      </li>
      <li class="nav-item" :class="{ active: activeTab === 'manage' }" @click="switchTab('manage')">
        <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.49.49 0 00-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 00-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 00-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58a.49.49 0 00-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1115.6 12 3.6 3.6 0 0112 15.6z"/></svg>
        <span class="menu-text">{{ t('installed_mods') }}</span>
      </li>
      <li class="nav-item" :class="{ active: activeTab === 'settings' }" @click="switchTab('settings')">
        <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.49.49 0 00-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 00-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 00-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58a.49.49 0 00-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1115.6 12 3.6 3.6 0 0112 15.6z"/></svg>
        <span class="menu-text">{{ t('settings') }}</span>
      </li>
      <li class="nav-item" :class="{ active: activeTab === 'about' }" @click="switchTab('about')">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
        <span class="menu-text">{{ t('about') }}</span>
      </li>
    </ul>
    <div class="sidebar-actions">
      <button class="sidebar-btn primary" @click="launchSteam">🎮 <span class="btn-text">{{ t('launch_game') }}</span></button>
      <button class="sidebar-btn secondary" @click="launchExe">🚀 <span class="btn-text">{{ t('launch_exe') }}</span></button>
      <button class="sidebar-btn secondary" @click="installPatcher">🔧 <span class="btn-text">{{ t('install_patcher') }}</span></button>
      <button class="sidebar-btn secondary" @click="cheat1000km">📏 <span class="btn-text">{{ t('cheat_1000km') }}</span></button>
    </div>
    <div class="sidebar-footer">
      <button class="sidebar-toggle" @click="sidebarCollapsed = !sidebarCollapsed">{{ sidebarCollapsed ? '▶' : '◀' }}</button>
    </div>
  </aside>

  <!-- ==================== 主内容 ==================== -->
  <main class="main-content" ref="mainContent" @scroll="handleScroll">
    <div class="container">

      <!-- ===== 浏览模组 ===== -->
      <div class="tab-content" :class="{ active: activeTab === 'browse' }">
        <div class="top-bar">
          <div class="source-selector">
            <label>{{ t('data_source') }}</label>
            <select v-model.number="sourceIndex" @change="loadMods()">
              <option v-for="(s, i) in sources" :key="i" :value="i">{{ s.name }}</option>
            </select>
            <label><input type="checkbox" v-model="strictMode" @change="loadMods()"> {{ t('strict_mode') }}</label>
          </div>
          <div class="view-toggle">
            <button class="view-btn" :class="{ active: viewMode === 'grid' }" @click="viewMode = 'grid'">{{ t('grid_view') }}</button>
            <button class="view-btn" :class="{ active: viewMode === 'list' }" @click="viewMode = 'list'">{{ t('list_view') }}</button>
          </div>
        </div>
        <div class="filters">
          <input class="search-input" v-model="searchQuery" :placeholder="t('search_placeholder')">
          <select class="category-select" v-model="selectedCategory">
            <option value="">{{ t('all_categories') }}</option>
            <option v-for="cat in categories" :key="cat" :value="cat">{{ cat }}</option>
          </select>
          <button class="action-btn secondary" @click="selectAll('browse')">{{ t('select_all') }}</button>
          <button class="action-btn secondary" @click="invertSelection('browse')">{{ t('invert_selection') }}</button>
          <button class="action-btn secondary" @click="clearSelection('browse')">{{ t('clear_selection') }}</button>
        </div>
        <div v-if="loading" class="loading">{{ t('loading') }}</div>
        <div v-else-if="filteredMods.length === 0" class="info">{{ t('no_mods_found') }}</div>
        <div v-else :class="viewMode === 'grid' ? 'mod-grid' : 'mod-list'">
          <div v-for="mod in filteredMods" :key="mod.FileName" class="mod-card-wrapper">
            <input type="checkbox" class="multi-check" :value="mod.FileName" v-model="selectedBrowse">
            <div class="mod-card" :class="{ 'has-conflict': hasConflict(mod.Name) }" @click="openDetail(mod)">
              <div class="mod-image">
                <img :src="mod.PictureLink || ''" :alt="mod.Name" loading="lazy" @error="imgFallback">
              </div>
              <div class="mod-info">
                <h3>{{ mod.Name }}</h3>
                <div class="author">{{ t('author') }}{{ mod.Author }}</div>
                <div class="version">{{ t('version') }}{{ mod.Version }}</div>
                <div>
                  <span v-if="mod.is_installed" class="mod-tag installed-tag">{{ t('installed') }}</span>
                  <span v-if="mod.Dependency" class="mod-tag dep">{{ t('dep_tag') }}</span>
                  <span v-if="hasConflict(mod.Name)" class="mod-tag conflict">{{ t('conflict_tag') }}</span>
                </div>
                <div class="desc">{{ mod.Description }}</div>
                <div class="mod-actions" @click.stop>
                  <button v-if="!mod.is_installed" class="btn-install" @click="doInstall(mod)" :disabled="mod._busy">{{ mod._busy ? '...' : t('install') }}</button>
                  <button v-else class="btn-uninstall" @click="doUninstall(mod)">{{ t('uninstall') }}</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- ===== 模组包 ===== -->
      <div class="tab-content" :class="{ active: activeTab === 'modpacks' }">
        <div class="top-bar">
          <div class="source-selector">
            <label>{{ t('data_source') }}</label>
            <select v-model.number="modpackSourceIndex" @change="loadModpacks()">
              <option v-for="(s, i) in sources" :key="i" :value="i">{{ s.name }}</option>
            </select>
          </div>
          <div class="view-toggle">
            <button class="view-btn" :class="{ active: modpackViewMode === 'grid' }" @click="modpackViewMode = 'grid'">{{ t('grid_view') }}</button>
            <button class="view-btn" :class="{ active: modpackViewMode === 'list' }" @click="modpackViewMode = 'list'">{{ t('list_view') }}</button>
          </div>
        </div>
        <div class="filters">
          <button class="action-btn primary" @click="exportModpack">{{ t('export') }}</button>
          <label class="action-btn secondary" style="cursor:pointer;">{{ t('import') }}<input type="file" accept=".txt" @change="importModpack" style="display:none"></label>
        </div>
        <div v-if="modpacksLoading" class="loading">{{ t('loading') }}</div>
        <div v-else-if="modpacks.length === 0" class="info">{{ t('no_mods_found') }}</div>
        <div v-else :class="modpackViewMode === 'grid' ? 'mod-grid' : 'mod-list'">
          <div v-for="pack in modpacks" :key="pack.Name || pack.Link" class="mod-card" @click="openDetail(pack)">
            <div class="mod-image">
              <img :src="pack.PictureLink || ''" :alt="pack.Name" loading="lazy" @error="imgFallback">
            </div>
            <div class="mod-info">
              <h3>{{ pack.Name }}</h3>
              <div class="author" v-if="pack.Author">{{ t('author') }}{{ pack.Author }}</div>
              <div class="desc">{{ pack.Description }}</div>
              <div class="mod-actions" @click.stop>
                <button class="btn-install" @click="doInstallModpack(pack)">{{ t('install') }}</button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- ===== 已安装 ===== -->
      <div class="tab-content" :class="{ active: activeTab === 'manage' }">
        <div class="top-bar">
          <div class="source-selector">
            <label>{{ t('data_source') }}</label>
            <select v-model.number="manageSourceIndex" @change="loadMods()">
              <option v-for="(s, i) in sources" :key="i" :value="i">{{ s.name }}</option>
            </select>
          </div>
          <div class="view-toggle">
            <button class="view-btn" :class="{ active: manageViewMode === 'grid' }" @click="manageViewMode = 'grid'">{{ t('grid_view') }}</button>
            <button class="view-btn" :class="{ active: manageViewMode === 'list' }" @click="manageViewMode = 'list'">{{ t('list_view') }}</button>
          </div>
        </div>
        <!-- 冲突警告 -->
        <div v-if="installedConflicts.length > 0" style="margin-bottom:15px;">
          <div v-for="c in installedConflicts" :key="c.reason" style="background:rgba(244,67,54,0.1);border:1px solid rgba(244,67,54,0.3);border-radius:var(--radius-md);padding:10px 15px;margin-bottom:8px;">
            <strong style="color:var(--danger);">{{ t('conflict_detect') }}</strong>
            <span style="color:#ddd;">{{ c.mods.join(' ↔ ') }} — {{ c.reason }}</span>
          </div>
        </div>
        <div class="filters">
          <button class="action-btn secondary" @click="selectAll('manage')">{{ t('select_all') }}</button>
          <button class="action-btn secondary" @click="invertSelection('manage')">{{ t('invert_selection') }}</button>
          <button class="action-btn secondary" @click="clearSelection('manage')">{{ t('clear_selection') }}</button>
        </div>
        <div v-if="loading" class="loading">{{ t('loading') }}</div>
        <div v-else-if="installedMods.length === 0" class="info">{{ t('no_installed_mods') }}</div>
        <div v-else :class="manageViewMode === 'grid' ? 'mod-grid' : 'mod-list'">
          <div v-for="mod in installedMods" :key="mod.Name || mod.FileName" class="mod-card-wrapper">
            <input type="checkbox" class="multi-check" :value="mod.Name || mod.FileName" v-model="selectedManage">
            <div class="mod-card" :class="{ 'has-conflict': hasConflict(mod.Name) }" @click="openDetail(mod)">
              <div class="mod-image">
                <img :src="mod.PictureLink || ''" :alt="mod.Name" loading="lazy" @error="imgFallback">
              </div>
              <div class="mod-info">
                <h3>{{ mod.Name }}</h3>
                <div class="version">{{ t('version') }}{{ mod.installed_version || mod.Version }}</div>
                <div>
                  <span v-if="mod.Dependency" class="mod-tag dep">{{ t('dep_tag') }}</span>
                  <span v-if="hasConflict(mod.Name)" class="mod-tag conflict">{{ t('conflict_tag') }}</span>
                </div>
                <div class="desc">{{ mod.Description }}</div>
                <div class="mod-actions" @click.stop>
                  <button class="btn-uninstall" @click="doUninstallByName(mod.Name || mod.FileName)">{{ t('uninstall') }}</button>
                  <button class="btn-update" :disabled="mod.installed_version === mod.Version" @click="doUpdateByName(mod.Name)">{{ mod.installed_version === mod.Version ? t('latest') : t('update') }}</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- ===== 设置 ===== -->
      <div class="tab-content" :class="{ active: activeTab === 'settings' }">
        <div class="settings-section">
          <h3>{{ t('update_settings') }}</h3>
          <div class="setting-row"><label>{{ t('manual_check') }}</label><button class="action-btn primary" @click="checkUpdate(true)" :disabled="checkingUpdate">{{ checkingUpdate ? t('checking_update') : t('manual_check') }}</button></div>
          <div class="setting-row"><label>{{ t('enable_proxy') }}</label><input type="checkbox" v-model="config.use_proxy"><span style="color:#888;font-size:0.8rem;">{{ t('proxy_recommend') }}</span></div>
          <div class="setting-row"><label>{{ t('backup_filename') }}</label><input type="text" v-model="config.backup_name" :placeholder="t('backup_placeholder')"></div>
        </div>
        <div class="settings-section">
          <h3>{{ t('ui_theme') }}</h3>
          <div class="setting-row"><label>{{ t('bg_color') }}</label><input type="color" v-model="themeBgColor"><button class="action-btn secondary" @click="resetTheme">{{ t('reset_default') }}</button><button class="action-btn primary" @click="applyTheme">{{ t('apply_theme') }}</button></div>
        </div>
        <div class="settings-section">
          <h3>{{ t('language_settings') }}</h3>
          <div class="setting-row"><label>{{ t('ui_language') }}</label><select v-model="currentLang" @change="changeLanguage"><option value="auto">{{ t('auto_system') }}</option><option value="zh">中文</option><option value="en">English</option><option value="fr">Français</option><option value="ar">العربية</option><option value="es">Español</option><option value="ru">Русский</option></select></div>
        </div>
        <div class="settings-section">
          <h3>{{ t('launch_settings') }}</h3>
          <div class="setting-row"><label>{{ t('game_exe_path') }}</label><input type="text" v-model="config.exe_path" :placeholder="t('exe_path_placeholder')"><button class="action-btn secondary" @click="browseExe">{{ t('browse') }}</button></div>
        </div>
        <button class="action-btn primary" @click="saveConfig" style="margin-top:10px;">{{ t('save_settings') }}</button>
      </div>

      <!-- ===== 关于 ===== -->
      <div class="tab-content" :class="{ active: activeTab === 'about' }">
        <div class="settings-section">
          <h3>{{ t('about_title') }}</h3>
          <p style="line-height:1.8;color:#ccc;">
            <strong>TLD 网页模组安装器</strong><br>The Long Drive Mod Installer<br>版本：{{ version }}<br>开发者：yiqiu<br>QQ群：661726941<br>Email：2308534727@qq.com<br>许可证：AGPL-3.0
          </p>
        </div>
        <div class="settings-section">
          <h3>{{ t('license') }}</h3>
          <textarea style="width:100%;height:200px;background:var(--bg-color);color:#ccc;border:1px solid var(--input-border);border-radius:var(--radius-md);padding:10px;resize:vertical;font-size:0.85rem;" readonly>{{ licenseText }}</textarea>
        </div>
      </div>

    </div>
  </main>

  <!-- ==================== 模组详情模态框 ==================== -->
  <div class="modal" v-if="showDetailModal" @click.self="showDetailModal = false">
    <div class="modal-content">
      <span class="close" @click="showDetailModal = false">&times;</span>
      <div class="modal-image" v-if="detailMod">
        <img :src="detailMod.PictureLink || ''" :alt="detailMod.Name" @error="imgFallback">
      </div>
      <div v-if="detailMod">
        <h2 style="color:var(--accent);">{{ detailMod.Name }}</h2>
        <p style="color:#888;margin:5px 0;">{{ t('author') }}{{ detailMod.Author }}</p>
        <p style="color:#888;margin:5px 0;">{{ t('version') }}{{ detailMod.Version }}</p>
        <p style="color:#888;margin:5px 0;" v-if="detailMod.Category">{{ t('category_label') }}{{ detailMod.Category }}</p>

        <!-- 依赖信息 -->
        <div v-if="detailDepInfo.length > 0" class="dep-list">
          <p style="color:var(--info);font-weight:bold;margin:8px 0 4px;">{{ t('dep_title') }}</p>
          <div v-for="dep in detailDepInfo" :key="dep.name" class="dep-item">
            <span>{{ dep.name }} <span style="color:#888;">v{{ dep.version }}</span></span>
            <span class="dep-status" :class="{ needed: !dep.is_installed }">{{ dep.is_installed ? t('dep_installed') : t('dep_needed') }}</span>
          </div>
        </div>

        <!-- 冲突信息 -->
        <div v-if="detailConflicts.length > 0" class="conflict-list">
          <p style="color:var(--danger);font-weight:bold;margin:8px 0 4px;">{{ t('conflict_title') }}</p>
          <div v-for="c in detailConflicts" :key="c.reason" class="conflict-item">
            <span>{{ c.mods.join(' ↔ ') }} — {{ c.reason }}</span>
          </div>
        </div>

        <p style="color:#888;margin:5px 0;" v-if="detailMod.Dependency && detailDepInfo.length === 0">{{ t('dep_fallback') }}{{ detailMod.Dependency }}</p>
        <div class="modal-description">{{ detailMod.Description }}</div>
        <div class="modal-description" v-if="detailMod.Changelog" style="margin-top:8px;"><strong>{{ t('changelog_label') }}</strong><br>{{ detailMod.Changelog }}</div>
        <div class="modal-actions">
          <button v-if="!detailMod.is_installed" class="btn-install" @click="doInstall(detailMod); showDetailModal = false">{{ t('install') }}</button>
          <button v-else class="btn-uninstall" @click="doUninstall(detailMod); showDetailModal = false">{{ t('uninstall') }}</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ==================== 操作结果模态框 ==================== -->
  <div class="modal" v-if="showResultModal" @click.self="showResultModal = false">
    <div class="modal-content">
      <span class="close" @click="showResultModal = false">&times;</span>
      <h2 style="color:var(--accent);">{{ t('operation_result') }}</h2>
      <div class="modal-description" style="max-height:400px;">
        <div v-for="(r, i) in resultLines" :key="i" style="padding:3px 0;white-space:pre-wrap;">{{ r }}</div>
      </div>
      <div class="modal-actions"><button class="action-btn secondary" @click="showResultModal = false">{{ t('close') }}</button></div>
    </div>
  </div>

  <!-- ==================== 批量操作栏 ==================== -->
  <div class="batch-bar" :class="{ active: batchBarActive }">
    <span>{{ t('selected_items', {count: batchCount}) }}</span>
    <button v-if="activeTab === 'browse'" class="action-btn primary" :disabled="batchBusy" @click="batchInstall">{{ batchBusy ? t('batch_installing') : t('batch_install') }}</button>
    <button class="action-btn danger" :disabled="batchBusy" @click="batchUninstall">{{ batchBusy ? t('batch_uninstalling') : t('batch_uninstall') }}</button>
    <button v-if="activeTab === 'manage'" class="action-btn warning" :disabled="batchBusy" @click="batchUpdate">{{ batchBusy ? t('batch_updating') : t('batch_update') }}</button>
    <button class="action-btn secondary" @click="clearCurrentSelection">{{ t('cancel') }}</button>
  </div>

  <!-- ==================== 下载管理器 ==================== -->
  <div class="download-manager">
    <div class="download-header" @click="dlExpanded = !dlExpanded">
      <span>{{ t('download_tasks') }} ({{ activeTaskCount }})</span>
      <span>{{ dlExpanded ? '▼' : '▲' }}</span>
    </div>
    <div class="task-list" v-show="dlExpanded">
      <div v-if="downloadTasks.length === 0" style="color:#888;text-align:center;padding:10px;">{{ t('no_tasks') }}</div>
      <div v-for="task in downloadTasks" :key="task.id" class="task-item">
        <div style="display:flex;justify-content:space-between;">
          <span>{{ task.name }}</span>
          <span :style="{color: task.status==='completed'?'#4caf50':task.status==='failed'?'#f44336':'#ff9800'}">{{ task.status === 'downloading' ? (task.progress||0).toFixed(0) + '%' : task.status }}</span>
        </div>
        <div class="task-progress-bar" :style="{width: (task.progress||0) + '%'}"></div>
      </div>
    </div>
  </div>

  <button id="back-to-top" v-show="showBackToTop" @click="scrollToTop">↑</button>

  <div class="toast-container">
    <div v-for="toast in toasts" :key="toast.id" class="toast" :class="toast.type">{{ toast.message }}</div>
  </div>

  </template>
</div>

<script>
function initVueApp() {
  var FD = JSON.parse(document.getElementById('flask-data').textContent);

  Vue.createApp({
    data: function() {
      return {
        appReady: true,
        version: FD.version,
        translations: FD.translations || {},
        activeTab: 'browse',
        sidebarCollapsed: false,
        mobileMenuOpen: false,

        sources: [],
        sourceIndex: 0,
        modpackSourceIndex: 0,
        manageSourceIndex: 0,
        strictMode: false,

        mods: [],
        modpacks: [],
        loading: false,
        modpacksLoading: false,

        searchQuery: '',
        debouncedSearch: '',
        selectedCategory: '',
        viewMode: 'grid',
        modpackViewMode: 'grid',
        manageViewMode: 'list',

        selectedBrowse: [],
        selectedManage: [],
        batchBusy: false,

        showDetailModal: false,
        detailMod: null,
        detailDepInfo: [],
        detailConflicts: [],
        detailFetchAbort: null,

        showResultModal: false,
        resultLines: [],

        installedConflicts: [],
        conflictModNames: {},

        downloadTasks: [],
        dlExpanded: false,
        taskTimer: null,

        config: { exe_path: '', use_proxy: false, backup_name: 'ModpackManager_old.exe' },
        themeBgColor: '#12121a',
        currentLang: 'auto',
        checkingUpdate: false,
        licenseText: '',
        toasts: [],
        toastId: 0,
        showBackToTop: false
      };
    },

    computed: {
      categories: function() { var s={}; this.mods.forEach(function(m){if(m.Category)s[m.Category]=1}); return Object.keys(s).sort(); },
      filteredMods: function() {
        var self=this, r=this.mods;
        if(this.debouncedSearch){var q=this.debouncedSearch.toLowerCase();r=r.filter(function(m){return(m.Name&&m.Name.toLowerCase().indexOf(q)!==-1)||(m.Author&&m.Author.toLowerCase().indexOf(q)!==-1)||(m.Description&&m.Description.toLowerCase().indexOf(q)!==-1)})}
        if(this.selectedCategory){r=r.filter(function(m){return m.Category===self.selectedCategory})}
        return r;
      },
      installedMods: function() { return this.mods.filter(function(m){return m.is_installed}); },
      batchBarActive: function() { if(this.activeTab==='browse')return this.selectedBrowse.length>0; if(this.activeTab==='manage')return this.selectedManage.length>0; return false; },
      batchCount: function() { if(this.activeTab==='browse')return this.selectedBrowse.length; if(this.activeTab==='manage')return this.selectedManage.length; return 0; },
      activeTaskCount: function() { return this.downloadTasks.filter(function(t){return t.status==='downloading'||t.status==='pending'}).length; }
    },

    watch: {
      searchQuery: function(val) {
        var self = this;
        clearTimeout(this._searchTimer);
        this._searchTimer = setTimeout(function() { self.debouncedSearch = val; }, 300);
      }
    },

    methods: {
      t: function(key, args) {
        var text = this.translations[key] || key;
        if(args){Object.keys(args).forEach(function(k){text=text.replace('{'+k+'}',String(args[k]))})}
        return text;
      },

      initLanguage: function() {
        var saved=localStorage.getItem('tld_lang')||'auto'; this.currentLang=saved;
        var lang=saved;
        if(lang==='auto'){var nl=navigator.language||'';lang=nl.startsWith('zh')?'zh':nl.startsWith('fr')?'fr':nl.startsWith('ar')?'ar':nl.startsWith('es')?'es':nl.startsWith('ru')?'ru':'en'}
        if(lang!=='zh'||Object.keys(this.translations).length===0){var self=this;fetch('/api/translations?lang='+lang).then(function(r){return r.json()}).then(function(d){self.translations=d}).catch(function(){})}
      },
      changeLanguage: function() { localStorage.setItem('tld_lang',this.currentLang); this.initLanguage(); },

      loadSources: function() { var self=this; fetch('/api/sources').then(function(r){return r.json()}).then(function(d){self.sources=d}).catch(function(){}) },

      loadMods: function() {
        var self=this; this.loading=true;
        var src=this.activeTab==='manage'?this.manageSourceIndex:this.sourceIndex;
        fetch('/api/mods?source='+src+'&strict='+this.strictMode).then(function(r){return r.json()}).then(function(d){
          self.mods=(d.mods||[]).map(function(m){return Object.assign({},m,{_busy:false})});
          if(d.active_source!==undefined){if(self.activeTab==='manage')self.manageSourceIndex=d.active_source;else self.sourceIndex=d.active_source}
          self.loadInstalledConflicts();
        }).catch(function(){self.showToast(self.t('load_mods_failed'),'error')}).finally(function(){self.loading=false});
      },

      loadModpacks: function() {
        var self=this; this.modpacksLoading=true;
        fetch('/api/modpacks?source='+this.modpackSourceIndex).then(function(r){return r.json()}).then(function(d){self.modpacks=d.modpacks||[]}).catch(function(){}).finally(function(){self.modpacksLoading=false});
      },

      switchTab: function(tab) {
        this.activeTab=tab; this.mobileMenuOpen=false;
        if(tab==='browse'||tab==='manage'){this.loadMods()}
        else if(tab==='modpacks'){this.loadModpacks()}
      },

      imgFallback: function(e) { e.target.src='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="70">📦</text></svg>'); },

      // ===== 冲突检测 =====
      loadInstalledConflicts: function() {
        var self=this;
        fetch('/api/check-conflicts').then(function(r){return r.json()}).then(function(d){
          self.installedConflicts=d.conflicts||[];
          self.conflictModNames={};
          (d.conflicts||[]).forEach(function(c){c.mods.forEach(function(m){self.conflictModNames[m.toLowerCase()]=true})});
        }).catch(function(){});
      },
      hasConflict: function(name) { return name && this.conflictModNames[name.toLowerCase()]; },

      // ===== 详情（#1 用正确数据源，#2 AbortController） =====
      openDetail: function(mod) {
        var self = this;
        if (this.detailFetchAbort) {
          try { this.detailFetchAbort.abort(); } catch(e) {}
        }
        this.detailFetchAbort = new AbortController();
        var signal = this.detailFetchAbort.signal;

        this.detailMod = mod;
        this.detailDepInfo = [];
        this.detailConflicts = [];
        this.showDetailModal = true;

        var src = this.activeTab === 'manage' ? this.manageSourceIndex : this.sourceIndex;

        if (mod.FileName) {
          fetch('/api/resolve-deps', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({filename: mod.FileName, source: src}),
            signal: signal
          })
          .then(function(r) { return r.json(); })
          .then(function(d) { self.detailDepInfo = d.dependencies || []; })
          .catch(function(e) { if (e.name !== 'AbortError') {} });
        }
        if (mod.Name) {
          fetch('/api/check-new-conflicts', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({name: mod.Name}),
            signal: signal
          })
          .then(function(r) { return r.json(); })
          .then(function(d) { self.detailConflicts = d.conflicts || []; })
          .catch(function(e) { if (e.name !== 'AbortError') {} });
        }
      },

      // ===== 安装 =====
      doInstall: function(mod) {
        var self=this; mod._busy=true;
        fetch('/api/install',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filename:mod.FileName,source:this.sourceIndex,auto_deps:true})})
        .then(function(r){return r.json()}).then(function(d){
          if(d.success){
            var msg=self.t('toast_install_success')+': '+(d.name||mod.Name);
            if(d.dep_results&&d.dep_results.length>0) msg+='\n'+d.dep_results.join('\n');
            self.showToast(msg,'success');
            mod.is_installed=true; mod.installed_version=d.new_version;
            self.loadInstalledConflicts();
          } else { self.showToast(d.error||self.t('install_request_failed'),'error') }
        }).catch(function(){self.showToast(self.t('install_request_failed'),'error')}).finally(function(){mod._busy=false});
      },

      doUninstall: function(mod) {
        var name=mod.Name||mod.FileName;
        if(!confirm(this.t('confirm_uninstall',{name:name})))return;
        var self=this;
        fetch('/api/uninstall',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name})})
        .then(function(r){return r.json()}).then(function(d){
          if(d.success){self.showToast(self.t('uninstall_success')+': '+name,'success');mod.is_installed=false;mod.installed_version='';self.loadInstalledConflicts()}
          else{self.showToast(d.error||self.t('uninstall_failed'),'error')}
        }).catch(function(){self.showToast(self.t('uninstall_request_failed'),'error')});
      },

      doUninstallByName: function(name) {
        if(!confirm(this.t('confirm_uninstall',{name:name})))return;
        var self=this;
        fetch('/api/uninstall',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name})})
        .then(function(r){return r.json()}).then(function(d){
          if(d.success){self.showToast(self.t('uninstall_success')+': '+name,'success');self.loadMods()}
          else{self.showToast(d.error||self.t('uninstall_failed'),'error')}
        }).catch(function(){self.showToast(self.t('uninstall_request_failed'),'error')});
      },

      doUpdateByName: function(name) {
        var self=this;
        fetch('/api/update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name,source:self.manageSourceIndex})})
        .then(function(r){return r.json()}).then(function(d){
          if(d.success){self.showToast(self.t('update_success')+': '+name,'success');self.loadMods()}
          else{self.showToast(d.error||self.t('update_failed'),'error')}
        }).catch(function(){self.showToast(self.t('update_request_failed'),'error')});
      },

      doInstallModpack: function(pack) {
        var self=this;
        if(!confirm(this.t('confirm_install_modpack',{name:pack.Name})))return;
        fetch('/api/install-modpack',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({Link:pack.Link,source:this.modpackSourceIndex})})
        .then(function(r){return r.json()}).then(function(d){
          if(d.results){self.resultLines=d.results;self.showResultModal=true}
          else if(d.error){self.showToast(d.error,'error')}
        }).catch(function(){self.showToast(self.t('install_modpack_failed'),'error')});
      },

      // ===== 多选 =====
      selectAll: function(tab) {
        if(tab==='browse')this.selectedBrowse=this.filteredMods.map(function(m){return m.FileName});
        else if(tab==='manage')this.selectedManage=this.installedMods.map(function(m){return m.Name||m.FileName});
      },
      invertSelection: function(tab) {
        if(tab==='browse'){var all=this.filteredMods.map(function(m){return m.FileName});var sel=this.selectedBrowse;this.selectedBrowse=all.filter(function(f){return sel.indexOf(f)===-1})}
        else if(tab==='manage'){var all2=this.installedMods.map(function(m){return m.Name||m.FileName});var sel2=this.selectedManage;this.selectedManage=all2.filter(function(n){return sel2.indexOf(n)===-1})}
      },
      clearSelection: function(tab) { if(tab==='browse')this.selectedBrowse=[]; else if(tab==='manage')this.selectedManage=[]; },
      clearCurrentSelection: function() { this.clearSelection(this.activeTab); },

      // ===== 批量（#3 过滤无效Name，#8 loading状态） =====
      batchInstall: function() {
        var self=this;
        if(this.batchBusy) return;
        if(!confirm(this.t('confirm_batch_install',{count:this.selectedBrowse.length})))return;
        this.batchBusy=true;
        fetch('/api/batch-install',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filenames:this.selectedBrowse,source:this.sourceIndex})})
        .then(function(r){return r.json()}).then(function(d){if(d.results){self.resultLines=d.results;self.showResultModal=true}self.selectedBrowse=[];self.loadMods()}).catch(function(){self.showToast(self.t('batch_install_failed'),'error')}).finally(function(){self.batchBusy=false});
      },
      batchUninstall: function() {
        var self=this;
        if(this.batchBusy) return;
        var names=this.activeTab==='browse'?this.selectedBrowse.reduce(function(arr,fn){
          var mod=self.mods.find(function(m){return m.FileName===fn});
          if(mod&&mod.Name) arr.push(mod.Name);
          return arr;
        },[]):this.selectedManage.filter(Boolean);
        if(names.length===0) return;
        if(!confirm(this.t('confirm_batch_uninstall',{count:names.length})))return;
        this.batchBusy=true;
        fetch('/api/batch-uninstall',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({names:names})})
        .then(function(r){return r.json()}).then(function(d){if(d.results){self.resultLines=d.results;self.showResultModal=true}self.clearCurrentSelection();self.loadMods()}).catch(function(){self.showToast(self.t('batch_uninstall_failed'),'error')}).finally(function(){self.batchBusy=false});
      },
      batchUpdate: function() {
        var self=this;
        if(this.batchBusy) return;
        if(!confirm(this.t('confirm_batch_update',{count:this.selectedManage.length})))return;
        this.batchBusy=true;
        fetch('/api/batch-update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({names:this.selectedManage,source:this.manageSourceIndex})})
        .then(function(r){return r.json()}).then(function(d){if(d.results){self.resultLines=d.results;self.showResultModal=true}self.selectedManage=[];self.loadMods()}).catch(function(){self.showToast(self.t('batch_update_failed'),'error')}).finally(function(){self.batchBusy=false});
      },

      // ===== 模组包 =====
      exportModpack: function() {
        var self=this;
        fetch('/api/export-modpack').then(function(r){
          if(r.ok)return r.blob().then(function(b){var u=URL.createObjectURL(b);var a=document.createElement('a');a.href=u;a.download='my_modpack.txt';a.click();URL.revokeObjectURL(u);self.showToast(self.t('export_success'),'success')});
          else return r.json().then(function(d){self.showToast(d.error||self.t('export_failed'),'error')});
        }).catch(function(){self.showToast(self.t('export_failed'),'error')});
      },
      importModpack: function(event) {
        var self=this; var file=event.target.files[0]; if(!file)return;
        var fd=new FormData(); fd.append('file',file); fd.append('source',this.modpackSourceIndex);
        fetch('/api/import-modpack',{method:'POST',body:fd}).then(function(r){return r.json()}).then(function(d){if(d.results){self.resultLines=d.results;self.showResultModal=true}else if(d.error){self.showToast(d.error,'error')}}).catch(function(){self.showToast(self.t('import_failed'),'error')});
        event.target.value='';
      },

      // ===== 侧边栏 =====
      launchSteam: function() { window.open('steam://rungameid/1017180'); this.showToast(this.t('toast_launch_success'),'success'); },
      launchExe: function() {
        var self=this; if(!this.config.exe_path){this.showToast(this.t('error_no_exe_path'),'error');return}
        fetch('/api/launch-exe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:this.config.exe_path})})
        .then(function(r){return r.json()}).then(function(d){if(d.success)self.showToast(self.t('toast_launch_success'),'success');else self.showToast(d.error||self.t('launch_failed'),'error')}).catch(function(){self.showToast(self.t('launch_failed'),'error')});
      },
      installPatcher: function() {
        var self=this;
        fetch('/api/install-patcher',{method:'POST'}).then(function(r){return r.json()}).then(function(d){if(d.success)self.showToast(self.t('toast_patcher_launched'),'success');else self.showToast(d.error||self.t('launch_failed'),'error')}).catch(function(){self.showToast(self.t('launch_failed'),'error')});
      },
      cheat1000km: function() { window.open('https://github.com/Gsjsjzhznsz/htmlTheLongDrivemodsChinesepatch/raw/main/1000km.reg','_blank'); },

      // ===== 设置 =====
      loadConfig: function() {
        var self=this;
        fetch('/api/config').then(function(r){return r.json()}).then(function(d){if(d)Object.keys(d).forEach(function(k){if(d[k]!==null&&d[k]!==undefined)self.config[k]=d[k]})}).catch(function(){});
        var bg=localStorage.getItem('tld_bg_color'); if(bg){this.themeBgColor=bg;document.documentElement.style.setProperty('--bg-color',bg)}
      },
      saveConfig: function() {
        var self=this;
        fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(this.config)}).then(function(){self.showToast(self.t('toast_settings_saved'),'success')}).catch(function(){self.showToast(self.t('save_failed'),'error')});
      },
      browseExe: function() {
        var self=this;
        fetch('/api/browse-exe',{method:'POST'}).then(function(r){return r.json()}).then(function(d){if(d.success){self.config.exe_path=d.path;self.showToast(self.t('toast_select_path'),'success')}else self.showToast(d.error||self.t('no_file_selected'),'warning')}).catch(function(){self.showToast(self.t('browse_failed'),'error')});
      },
      applyTheme: function() { document.documentElement.style.setProperty('--bg-color',this.themeBgColor); localStorage.setItem('tld_bg_color',this.themeBgColor); this.showToast(this.t('toast_theme_applied'),'success'); },
      resetTheme: function() { this.themeBgColor='#12121a'; document.documentElement.style.setProperty('--bg-color','#12121a'); localStorage.removeItem('tld_bg_color'); },

      checkUpdate: function(isManual) {
        var self=this; this.checkingUpdate=true;
        fetch('/api/check-update').then(function(r){return r.json()}).then(function(d){if(d.update_available){if(confirm(self.t('update_found',{ver:d.latest})))self.performUpdate(d.download_url)}else if(isManual)alert(self.t('update_latest'))}).catch(function(){if(isManual)self.showToast(self.t('check_update_failed'),'error')}).finally(function(){self.checkingUpdate=false});
      },
      performUpdate: function(url) {
        var self=this;
        fetch('/api/do-update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:url,backup_name:this.config.backup_name||'ModpackManager_old.exe'})})
        .then(function(r){return r.json()}).then(function(d){if(d.success)alert(self.t('update_close_hint'));else self.showToast(d.error||self.t('update_failed'),'error')}).catch(function(){self.showToast(self.t('update_failed'),'error')});
      },

      // ===== 下载任务 =====
      pollTasks: function() { var self=this; fetch('/api/tasks').then(function(r){return r.json()}).then(function(d){self.downloadTasks=d}).catch(function(){}) },
      startPolling: function() { var self=this; this.taskTimer=setInterval(function(){self.pollTasks()},2000) },
      stopPolling: function() { if(this.taskTimer){clearInterval(this.taskTimer);this.taskTimer=null} },

      loadLicense: function() { var self=this; fetch('/api/license').then(function(r){return r.text()}).then(function(t){self.licenseText=t}).catch(function(){}) },

      // #10 Toast 去重
      showToast: function(message, type) {
        if (this.toasts.some(function(t) { return t.message === message && t.type === (type || 'success'); })) return;
        var self=this; var id=++this.toastId;
        this.toasts.push({id:id,message:message,type:type||'success'});
        setTimeout(function(){self.toasts=self.toasts.filter(function(t){return t.id!==id})},3500);
      },

      handleScroll: function() { this.showBackToTop=this.$refs.mainContent&&this.$refs.mainContent.scrollTop>300 },
      scrollToTop: function() { if(this.$refs.mainContent)this.$refs.mainContent.scrollTo({top:0,behavior:'smooth'}) }
    },

    mounted: function() {
      this.initLanguage(); this.loadSources(); this.loadMods(); this.loadConfig(); this.loadLicense(); this.startPolling(); this.checkUpdate(false);
    },
    beforeUnmount: function() { this.stopPolling(); }
  }).mount('#app');
}
</script>

{% endraw %}
</body>
